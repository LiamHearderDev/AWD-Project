<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>SpeedLogger</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
        <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
        {% block head %}{% endblock %}
    </head>
    <body>
        <header style="display: flex; justify-content: space-between; align-items: center; padding: 10px; background-color: #d6d6d6;">
            <h1 style="padding-left: 10px;">SpeedLogger</h1>
            <nav style="display: flex;">
                <a style="padding: 10px;" href="{{ url_for('intro') }}">Home</a>
                <a style="padding: 10px;" href="{{ url_for('game') }}">Game</a>
                <a style="padding: 10px;" href="{{ url_for('dashboard') }}">Dashboard</a>
                <a style="padding: 10px;" href="{{ url_for('leaderboard') }}">Leaderboard</a>
                <a style="padding: 10px;" href="{{ url_for('profile') }}">Profile</a>
            </nav>
        </header>
        <main>
            {% block content %}{% endblock %}
        </main>
    </body>
</html>
