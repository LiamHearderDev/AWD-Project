<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>SpeedLogger</title>
        <link rel="icon" type="image/x-icon" href="{{url_for('static', filename='img/speedlogger_icon.png')}}">
        <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">

        <!-- Bootstrap -->

        <!-- Latest compiled and minified CSS -->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
        <!-- jQuery library -->
        <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.slim.min.js"></script>
        <!-- Popper JS -->
        <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
        <!-- Latest compiled JavaScript -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>

        {% block head %}{% endblock %}
    </head>
    <body>
          <div id="header" style="display: flex; align-items: center; justify-content: center; height: 90px; background-color: var(--base-colour-0); overflow: auto;">
            <div style="display: flex; align-items: center; justify-content: center;">
                <a href="{{ url_for('intro') }}">
                  <img src="{{ url_for('static', filename='img/speedlogger_icon.png') }}" style="max-width: 75px; max-height: 75px; margin: 0;">
                </a>
                <h1 class="text-white font-weight-bold hide-500" style="margin-left: 15px; font-size: xx-large;">SpeedLogger</h1>
            </div>
            <nav style="position: absolute; left: 2%;">
                <a class="header-link text-white font-weight-bold" href="{{ url_for('intro') }}">Home</a>
                <a class="header-link hide-900 text-white font-weight-bold" href="{{ url_for('game') }}">Game</a>
                <a class="header-link hide-900 text-white font-weight-bold" href="{{ url_for('stats') }}">Stats</a>
                <a class="header-link hide-900 text-white font-weight-bold" href="{{ url_for('leaderboard') }}">Leaderboard</a>
            </nav>
            <nav style="position: absolute; right: 2%; display: flex;">
              {% if current_user.is_anonymous %}
              <a class="header-link text-white font-weight-bold" href="{{ url_for('login') }}">Login</a>
              {% else %}
              <a class="header-link text-white font-weight-bold" href="{{ url_for('profile') }}"> {{ current_user.username }}</a>
              <a class="header-link text-white font-weight-bold" href="{{ url_for('logout') }}">Logout</a>
              {% endif %}
            </nav>
          </div>
        <main class="container" style="padding-top: 4%;">
            <div class="row">
              <div class="col-12">
                {% block content %}{% endblock %}
              </div>
            </div>
        </main>
        <footer class="container" style="padding: 20px 0; border-top: 1px solid #ddd; margin-top: 40px;">
            <div class="row">
              <div class="col-12 text-center">
                <p class="small">
                  &copy; 2025 SpeedLogger
                  <!-- Add More Footer Stuff Here -->
                </p>
              </div>
            </div>
        </footer>
    </body>
</html>
