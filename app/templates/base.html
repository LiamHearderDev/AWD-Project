<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>SpeedLogger</title>
        <link rel="icon" type="image/x-icon" href="{{url_for('static', filename='img/speedlogger_icon.png')}}">
        <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">

        <!-- Bootstrap -->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">  <!-- Latest compiled and minified CSS -->
        <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.slim.min.js"></script>               <!-- jQuery library -->
        <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>            <!-- Popper JS -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>    <!-- Latest compiled JavaScript -->

        {% block head %}{% endblock %}
    </head>
    <body>
      <!-- Header Bar -->
      <div id="header" class="d-flex align-items-center justify-content-center fixed-top shadow-sm" style="top:0;bottom: 30px; left: 0;width: 100%; height: 90px; z-index: 1000; overflow: auto;
      background-color: rgba(0,0,0,0.3); border-bottom: 1px solid rgba(255,255,255,0.1);
      -webkit-backdrop-filter: blur(8px);backdrop-filter: blur(8px);">

        <!-- Title and Logo -->
        <a href="{{ url_for('intro.intro') }}" class="d-flex align-items-center justify-content-center" style="text-decoration: none;">
          <img src="{{ url_for('static', filename='img/speedlogger_icon.png') }}" style="max-width: 75px; max-height: 75px; margin: 0;">
          <h1 class="text-white font-weight-bold hide-500" style="margin-left: 15px; font-size: xx-large;">SpeedLogger</h1>
        </a>

        <!-- Site Navigation links -->
        <nav class="position-absolute" style="left: 2%;">
            <a class="header-link text-white font-weight-bold" href="{{ url_for('intro.intro') }}">Home</a>
            <a class="header-link hide-900 text-white font-weight-bold" href="{{ url_for('game.game') }}">Game</a>
            <a class="header-link hide-900 text-white font-weight-bold" href="{{ url_for('stats.stats') }}">Stats</a>
            <a class="header-link hide-900 text-white font-weight-bold" href="{{ url_for('stats.leaderboard') }}">Leaderboard</a>
        </nav>

        <!-- Profile/Login Navigation -->
        <nav class="d-flex position-absolute" style="right: 2%;">
          {% if current_user.is_anonymous %}
          <a class="header-link text-white font-weight-bold" href="{{ url_for('auth.login') }}">Login</a>
          {% else %}
          <a class="header-link text-white font-weight-bold" href="{{ url_for('main.profile') }}"> {{ current_user.username }}</a>
          <a class="header-link text-white font-weight-bold" href="{{ url_for('auth.logout') }}">Logout</a>
          {% endif %}
        </nav>
      </div>

      <!-- Primary Page content -->
      <main class="container" style="padding-top: 180px;">
        <div class="row">
          <div class="col-12">
            {% block content %}{% endblock %}
          </div>
        </div>
      </main>

      <!-- Page Footer -->
      <footer class="container" style="padding: 20px 0; border-top: 1px solid #ddd; margin-top: 40px;">
          <div class="row">
            <div class="col-12 text-center">
              <p class="small">
                &copy; 2025 SpeedLogger
              </p>
            </div>
          </div>
      </footer>
    </body>
</html>
