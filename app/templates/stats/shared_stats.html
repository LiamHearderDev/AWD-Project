{% extends "base.html" %}

{% block head %}
    <link rel="stylesheet" href="{{ url_for('static', filename='css/shared_stats.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        const chartData = {
            labels: JSON.parse('{{ data.labels|tojson }}'),
            wpm: JSON.parse('{{ data.wpm|tojson }}'),
            accuracy: JSON.parse('{{ data.accuracy|tojson }}')
        };
    </script>
    <script src="{{ url_for('static', filename='js/shared_stats.js') }}"></script>
{% endblock %}

{% block content %}
    <h1>Shared Statistics - {{ data.period|capitalize }}</h1>
    <table id="statsTable">
        <thead>
            <tr><th>Metric</th><th>Value</th><th>Time</th><th>Paragraph No.</th></tr>
        </thead>
        <tbody>
            {% for row in data.stats %}
            <tr>
                <td>{{ row.metric }}</td>
                <td>{{ row.value }}</td>
                <td>{{ row.time }}</td>
                <td>{{ row.paragraph }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
    <canvas id="statsChart" width="800" height="400"></canvas>
{% endblock %}
