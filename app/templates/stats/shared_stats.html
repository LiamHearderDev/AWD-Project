{% extends "base.html" %}

{% block head %}
  <link rel="stylesheet" href="{{ url_for('static', filename='css/shared_stats.css') }}">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="{{ url_for('static', filename='js/shared_stats.js') }}"></script>
{% endblock %}

{% block content %}
  <h1>Shared Statistics – {{ data.period|capitalize }}</h1>

  <div class="table-section">
    <table id="statsTable">
      <thead>
        <tr>
          <th>Metric</th>
          <th>Value</th>
          <th>Timestamp</th>
          <th>Paragraph No.</th>
        </tr>
      </thead>
      <tbody>
        {% for row in data.stats %}
        <tr>
          <td>{{ row.metric }}</td>
          <td>{{ row.value }}</td>
          <td>{{ row.timestamp }}</td>
          <td>{{ row.paragraph }}</td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>

  <div class="chart-section">
    <canvas id="statsChart"
      width="800"
      height="400"
      data-period="{{ data.period }}"
      data-labels='{{ data.labels   | tojson }}'
      data-wpm='{{ data.wpm      | tojson }}'
      data-accuracy='{{ data.accuracy | tojson }}'
    ></canvas>
  </div>
{% endblock %}
